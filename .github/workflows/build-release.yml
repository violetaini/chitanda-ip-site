name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/badges/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard public build env
        run: node scripts/assert-public-build-env.mjs

      - name: Build
        run: npm run build

      - name: Package dist
        run: |
          tar -czf chitanda-ip-site-dist.tar.gz -C dist .
          (cd dist && zip -r ../chitanda-ip-site-dist.zip .)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: chitanda-ip-site-dist
          path: |
            chitanda-ip-site-dist.tar.gz
            chitanda-ip-site-dist.zip
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="release-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            chitanda-ip-site-dist.tar.gz \
            chitanda-ip-site-dist.zip \
            --title "Build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Automated build for commit ${GITHUB_SHA}."
